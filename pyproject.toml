[project]
name = "telco-churn-prediction"
version = "0.1.0"
description = "Telco Customer Churn Prediction - binary classification model to rank customers by churn risk"
readme = "README.md"
authors = [
    { name = "NAvrosjo", email = "navrosjo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "statsmodels>=0.14.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "jupyter>=1.0.0",
    "shap>=0.44.0",
    "optuna>=3.5.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
